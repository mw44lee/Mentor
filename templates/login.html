{% extends "base.html" %}
{% block body %}
<div class="login card">
  <h1>멘토링 업무 관리</h1>
  {% if not pw_set %}
  <p class="flash">아직 비밀번호가 없습니다. PC에서 아래 명령으로 먼저 설정하세요.<br><code>python manage.py set-password</code> (앱 폴더의 가상환경에서)</p>
  {% endif %}
  {% if error %}<p class="flash">{{ error }}</p>{% endif %}
  <form method="post" action="/login">
    <label>비밀번호</label>
    <input type="password" name="password" autofocus required>
    <p><button class="btn primary">로그인</button></p>
  </form>
</div>
{% endblock %}
